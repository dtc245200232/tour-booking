global:
  scrape_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['prometheus:9090'] }]
  - job_name: app            # web (Node.js)
    static_configs: [{ targets: ['app:3000'] }]
  - job_name: cadvisor       # container
    static_configs: [{ targets: ['cadvisor:8080'] }]
  - job_name: nginx          # web server
    static_configs: [{ targets: ['nginx-exporter:9113'] }]
  - job_name: postgres       # database
    static_configs: [{ targets: ['postgres-exporter:9187'] }]