name: tour

services:
  db:
    image: postgres:16-alpine
    container_name: tour_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db_net]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tour_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    networks: [web_net, db_net]
    depends_on:
      db: { condition: service_healthy }

  app:
    build: ./app
    container_name: tour_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: tour_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks: [web_net, db_net, monitor_net]
    depends_on:
      db: { condition: service_healthy }
    user: "node"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: tour_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [web_net, monitor_net]
    depends_on: [app]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:latest
    container_name: tour_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitor_net]

  grafana:
    image: grafana/grafana:latest
    container_name: tour_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    networks: [monitor_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tour_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitor_net]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: tour_nginx_exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks: [monitor_net]
    depends_on: [nginx]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tour_pg_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    networks: [monitor_net, db_net]
    depends_on:
      db: { condition: service_healthy }
  loki:
    image: grafana/loki:3.0.0
    container_name: tour_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitor_net]

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tour_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitor_net]
    depends_on: [loki]

networks:
  web_net:
  db_net:
    internal: true      # DB không ra được internet, không truy cập từ ngoài
  monitor_net:

volumes:
  db_data:
  prom_data:
  grafana_data:
  loki_data: