name: tour

services:
  db:
    image: postgres:16-alpine
    container_name: tour_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db_net]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tour_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    networks: [web_net, db_net]
    depends_on:
      db: { condition: service_healthy }

  app:
    build: ./app
    container_name: tour_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: tour_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    networks: [web_net, db_net, monitor_net]
    depends_on:
      db: { condition: service_healthy }
    user: "node"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: tour_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [web_net, monitor_net]
    depends_on: [app]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  web_net:
  db_net:
    internal: true      # DB không ra được internet, không truy cập từ ngoài
  monitor_net:

volumes:
  db_data: